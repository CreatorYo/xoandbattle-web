<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>X&O Battle Web</title>
    <meta name="description" content="X&O Battle Web version is the online version to play X&O Battle. Features are limited, but to get the full experience, please download the app." />
    <meta name="apple-itunes-app" content="app-id=6745736399" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:title" content="X&O Battle Web" />
    <meta property="og:description" content="X&O Battle Web version is the online version to play X&O Battle. Features are limited, but to get the full experience, please download the app." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://assets.creatoryogames.com/xobattle-assets/EmbedBanner_Web_Version.png" />

    <link rel="icon" type="image/png" href="/assets/XO_Battle_Logo_Transparent.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="X&O Battle" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://assets.creatoryogames.com/xobattle-assets/EmbedBanner_Web_Version.png" />

    <style>
      html { background-color: #f2f2f7; color-scheme: light; }
      html.dark { background-color: #000000; color-scheme: dark; }
    </style>

    <script>
      (function () {
        try {
          var root = document.documentElement;
          var storage = window.localStorage;
          var hex = /^#[0-9a-f]{6}$/i;

          var theme = storage.getItem('tic-tac-toe-theme');
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.add(dark ? 'dark' : 'light');

          if (storage.getItem('tic-tac-toe-reduce-motion') === 'true') {
            root.classList.add('reduce-motion');
          }

          var glass = storage.getItem('tic-tac-toe-glass-tint');
          if (glass !== null && isFinite(Number(glass))) {
            var tint = Math.round(Math.min(100, Math.max(0, Number(glass))));
            root.style.setProperty('--glass-tint-user', Math.round(40 + tint * 0.58) + '%');
          }

          var stored = storage.getItem('tic-tac-toe-app-theme-color');
          var accent = stored && hex.test(stored) ? stored.toLowerCase() : '#3b82f6';
          root.style.setProperty('--brand', accent);

          var custom = storage.getItem('tic-tac-toe-status-bar-color');
          var statusBarColor = storage.getItem('tic-tac-toe-status-bar-synced') === 'true'
            ? accent
            : custom && hex.test(custom) ? custom.toLowerCase() : dark ? '#000000' : '#f2f2f7';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute('content', statusBarColor);
          });
        } catch {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
